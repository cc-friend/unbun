name: Publish

# Publishes to npm when a version tag (e.g. v1.2.3) is pushed.
# Create tags with `bun run release:*` (see vbt.config.json).
#
# Auth is via npm Trusted Publishing (OIDC): configure GitHub Actions as a
# trusted publisher for the package on npmjs.com. No NPM_TOKEN secret needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted Publishing (OIDC) needs npm >= 11.5.1, which Node 24 already
      # ships (24.20 carries npm 11.19). Installing npm@latest on top instead
      # only breaks when npm raises its own engine floor past the Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck, lint, format, test)
        run: bun run checkall

      - name: Publish to npm
        # npm requires an explicit --tag for prerelease versions, so derive it:
        # 1.0.0-beta.0 -> "beta", a stable 1.0.0 -> "latest".
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"; tag="${tag%%.*}"
          else
            tag="latest"
          fi
          echo "Publishing $version to dist-tag '$tag'"
          npm publish --provenance --access public --tag "$tag"

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
